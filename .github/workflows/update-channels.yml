name: Update IPTV Channels

on:
  schedule:
    # Every Sunday at 00:00 UTC
    # = Sunday 05:30 IST
    - cron: "0 0 * * 0"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update channel database
        run: |
          python scripts/update_channels.py

      - name: Check changes
        run: |
          git status --short

      - name: Commit updated channels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/channels.json

          if git diff --cached --quiet; then
            echo "No channel changes detected."
          else
            git commit -m "chore: update IPTV channels"
            git push
          fi